name: CI

# Every branch and every pull request. These checks replaced Ben reading each
# diff, and they are advisory: this repository is private on a GitHub free plan,
# where branch protection is unavailable, so nothing server-side blocks a merge
# over a red check or a push straight to `main`. What holds is the convention in
# .claude/rules/git-authority.md and the client-side deny list and hooks that
# every instance clones. See docs/CLAUDE_CODE_SETUP.md § Where the gate actually
# lives. `protected-paths` runs from .github/workflows/protected-paths.yml, not
# here, so that applying or removing the `ben-review` label reruns that check
# alone and never the suite.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  # sources.py accepts this to clear VERIFY_X509_STRICT only; CERT_REQUIRED and
  # hostname checking still apply. No test reaches the network, so it is inert
  # here and set only to keep the runner identical to a container session.
  NFL_DFS_VENV_DIR: ${{ github.workspace }}/.venv-linux
  NFL_DFS_UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache-linux

jobs:
  boundaries:
    # Split out from `suite` so a broken permanent boundary is legible without
    # reading 737 test results.
    name: boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install pinned environment
        run: uv sync --all-groups --locked --python 3.13.7
      - name: Permanent boundaries
        run: uv run pytest tests/test_repo_boundaries.py -q --no-header

  suite:
    name: suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history. The default depth-1 checkout has no base commit, so the
      # whitespace check below would abort with `fatal: bad object` on every
      # pull request and silently skip on every push.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install pinned environment
        run: uv sync --all-groups --locked --python 3.13.7

      # `git diff --check` with no argument compares the working tree to the
      # index, which is always clean on a runner. It has to be given a range to
      # mean anything here. The base object is verified present before use so a
      # missing one is a named skip rather than `fatal: bad object` under
      # `bash -e`.
      - name: Whitespace and conflict markers
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base=$(git rev-parse HEAD~1 2>/dev/null || true); fi
          if [ -n "$base" ] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            merge_base=$(git merge-base "$base" HEAD 2>/dev/null || echo "$base")
            git diff --check "$merge_base" HEAD
          else
            echo "No usable base commit (first commit, or history unavailable); skipped."
          fi

      - name: Compile every module
        run: uv run python -m compileall -q src scripts

      # `set +e` matters: the default shell is `bash -e`, so a failing suite
      # would abort the step before the result line is captured, and a red run
      # would report nothing about why.
      - name: Complete pinned suite
        id: suite
        run: |
          set +e
          set -o pipefail
          started=$(date -u +%s)
          uv run pytest 2>&1 | tee /tmp/pytest.log
          status=$?
          ended=$(date -u +%s)
          # One definition of "what the summary line is", shared with the local
          # path, so CI and a developer's terminal can never disagree.
          line=$(uv run python -c "
          import pathlib, sys
          sys.path.insert(0, 'scripts')
          from record_verify import summary_line
          print(summary_line(pathlib.Path('/tmp/pytest.log').read_text(errors='replace')) or 'NO_SUMMARY_LINE')
          ")
          printf 'result_line=%s\n' "$line" >> "$GITHUB_OUTPUT"
          printf 'duration=%s\n' "$((ended - started))" >> "$GITHUB_OUTPUT"
          echo "$line"
          exit $status

      - name: Record the result
        if: always()
        run: |
          mkdir -p state
          cat > state/last-ci.json <<JSON
          {
            "schema_version": "nfl_ci_result_v1",
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref_name }}",
            "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "conclusion": "${{ job.status }}",
            "result_line": "${{ steps.suite.outputs.result_line }}",
            "duration_seconds": "${{ steps.suite.outputs.duration }}",
            "observed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          {
            echo "### Suite"
            echo ''
            echo '```'
            cat state/last-ci.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # An artifact, not a commit. CI never pushes to this repository: a
      # workflow that writes to `main` would have to bypass the very branch
      # protection that makes autonomous merge safe.
      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: last-ci-${{ github.run_id }}
          path: state/last-ci.json
          if-no-files-found: warn

  windows:
    # Windows is where slates are operated, and until 2026-09-22 it was never
    # tested. That day a local run on Ben's machine failed 25 tests that CI had
    # never seen: `make_offensive_role_evidence.py` hashed an excerpt's bytes
    # and then wrote it with `write_text`, which translates "\n" to os.linesep,
    # so on Windows every depth-role package refused its own capture. P7, the
    # chunk that resolves who is actually starting, could not run on the only
    # machine that operates slates. A Linux-only suite cannot see that class of
    # defect at all.
    #
    # It does not gate anything the Linux `suite` job already gates; it exists
    # so a byte, path or newline assumption that only breaks on Windows is
    # caught here rather than at a lock clock.
    name: windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install pinned environment
        run: uv sync --all-groups --locked --python 3.13.7
      - name: Complete pinned suite
        run: uv run pytest -q --no-header
