[project]
name = "nfl-dfs"
version = "0.1.0"
description = "Evidence-first local DraftKings NFL Classic and Showdown engine"
readme = "README.md"
requires-python = "==3.13.7"
license = { text = "MIT" }
dependencies = [
  "highspy==1.11.0",
  "httpx==0.28.1",
  "numpy==2.3.2",
  "openpyxl==3.1.5",
  "polars==1.32.3",
  "pyarrow==21.0.0",
  "pydantic==2.11.7",
  "scikit-learn==1.7.1",
  "statsmodels==0.14.5",
]

[project.scripts]
nfl-dfs = "nfl_dfs.cli:main"

[dependency-groups]
dev = [
  "hypothesis==6.138.2",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nfl_dfs"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["nfl_dfs"]
